<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Revincxt — ideas into systems</title>
  <desc id="desc">A warm cream and lavender editorial banner with subtle orbital graphics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9F4"/>
      <stop offset="0.52" stop-color="#F7EAF2"/>
      <stop offset="1" stop-color="#E9DDF5"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5CDBD"/>
      <stop offset="1" stop-color="#CDB8E5"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#856F8E" opacity="0.13"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#8E719B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="28" fill="url(#dots)"/>
  <path d="M0 249 C236 192 433 310 686 253 C920 200 1031 226 1280 153 L1280 320 L0 320 Z" fill="#FFFFFF" opacity="0.28"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#51445B">
    <text x="82" y="102" font-size="16" font-weight="650" letter-spacing="4.8" fill="#947B9E">HELLO, I AM</text>
    <text x="78" y="168" font-size="58" font-weight="720" letter-spacing="3">REVINCXT</text>
    <text x="82" y="205" font-size="20" font-weight="430" fill="#75657D">Turning curious ideas into thoughtful systems.</text>
  </g>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">
    <rect x="82" y="234" width="116" height="34" rx="17" fill="#FFFDFC" stroke="#E8CDD2"/>
    <text x="140" y="256" text-anchor="middle" fill="#8C6470">AI planning</text>
    <rect x="210" y="234" width="174" height="34" rx="17" fill="#FCF8FD" stroke="#D9C7E7"/>
    <text x="297" y="256" text-anchor="middle" fill="#745E82">reinforcement learning</text>
    <rect x="396" y="234" width="92" height="34" rx="17" fill="#FFF9F2" stroke="#ECD6C0"/>
    <text x="442" y="256" text-anchor="middle" fill="#8B6A54">Python</text>
  </g>

  <g transform="translate(880 30)" filter="url(#shadow)">
    <circle cx="164" cy="130" r="103" fill="#FFFCFA" opacity="0.74"/>
    <circle cx="164" cy="130" r="76" fill="url(#orb)" opacity="0.92"/>
    <circle cx="139" cy="103" r="32" fill="#FFF6F0" opacity="0.67"/>
  </g>

  <g transform="translate(880 30)" fill="none" stroke="#7B6687">
    <ellipse cx="164" cy="130" rx="152" ry="59" stroke-width="2" opacity="0.46" transform="rotate(-18 164 130)"/>
    <ellipse cx="164" cy="130" rx="133" ry="43" stroke-width="1.5" opacity="0.27" transform="rotate(34 164 130)"/>
  </g>
  <circle cx="1131" cy="84" r="9" fill="#F3BBA6"/>
  <circle cx="928" cy="205" r="6" fill="#B89DCE"/>
  <circle cx="1197" cy="222" r="5" fill="#D7A7B4"/>
  <path d="M1170 61 l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#FFFDF9" opacity="0.9"/>
</svg>
